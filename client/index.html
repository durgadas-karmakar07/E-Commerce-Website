<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURA | Modern Premium E-Commerce Store</title>
    <meta name="description" content="Shop the finest curated lifestyle, tech, and apparel products with fast shipping, secure payments, and verified reviews." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen">
    <script>
      // If opened directly from Windows Explorer (file:// protocol), ES modules are blocked by the browser.
      // Show an immediate helpful launcher screen with links and batch file guidance.
      if (window.location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', function () {
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = [
              '<div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; padding: 24px; text-align: center;">',
              '  <div style="width: 68px; height: 68px; border-radius: 20px; background: linear-gradient(135deg, #4f46e5, #818cf8); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 34px; margin-bottom: 20px; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);">A</div>',
              '  <h1 style="font-size: 26px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.02em;">AURA E-Commerce Platform</h1>',
              '  <p style="font-size: 14px; color: #94a3b8; max-width: 540px; margin-bottom: 24px; line-height: 1.6;">',
              '    Yeh website modern React + Vite me bani hai. Browser security (CORS) ki wajah se <b>file://</b> se direct click karne par ES modules block ho jate hain.',
              '  </p>',
              '  <div style="background: rgba(99, 102, 241, 0.12); border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 16px; padding: 20px; max-width: 560px; margin-bottom: 28px; text-align: left;">',
              '    <div style="font-weight: 700; color: #a5b4fc; font-size: 14px; margin-bottom: 8px;">⚡ Website Kholne Ka Sahi Tareeka:</div>',
              '    <ol style="margin: 0; padding-left: 20px; font-size: 13px; color: #cbd5e1; line-height: 1.8;">',
              '      <li>Niche diye gaye blue button par click karke direct browser me kholein:</li>',
              '      <li>Ya root folder me <b>start-website.bat</b> file ko double-click karein.</li>',
              '    </ol>',
              '  </div>',
              '  <div style="display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;">',
              '    <a href="http://localhost:5173" style="background: #4f46e5; color: white; padding: 14px 28px; border-radius: 14px; font-weight: 800; text-decoration: none; font-size: 15px; box-shadow: 0 4px 20px rgba(79, 70, 229, 0.4); display: inline-flex; align-items: center; gap: 8px;">',
              '      🚀 Open Website (http://localhost:5173)',
              '    </a>',
              '    <a href="http://localhost:5173/admin" style="background: #1e293b; color: #e2e8f0; border: 1px solid #334155; padding: 14px 22px; border-radius: 14px; font-weight: 700; text-decoration: none; font-size: 14px;">',
              '      👑 Open Admin Dashboard',
              '    </a>',
              '  </div>',
              '</div>'
            ].join('');
          }
        });
      }
    </script>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; color: white; font-family: system-ui, -apple-system, sans-serif;">
        <div style="width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(135deg, #4f46e5, #818cf8); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 26px; margin-bottom: 16px; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);">A</div>
        <div style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px;">AURA Lifestyle Store</div>
        <div style="font-size: 12px; color: #94a3b8; display: flex; align-items: center; gap: 8px;">
          <span>Loading experience...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
