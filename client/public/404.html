<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURA Lifestyle Store - Loading</title>
    <script>
      // Single Page Application redirect for Netlify / static hosts
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      window.location.replace('/' + (path && path !== '/' ? '?p=' + encodeURIComponent(path) : '') + (search ? '&' + search.slice(1) : '') + hash);
    </script>
    <meta http-equiv="refresh" content="0; url=/" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0b0f19;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255,255,255,0.1);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      h2 { font-size: 1.25rem; font-weight: 700; margin: 0 0 8px; }
      p { font-size: 0.875rem; color: #94a3b8; margin: 0; }
    </style>
  </head>
  <body>
    <div>
      <div class="spinner"></div>
      <h2>AURA Lifestyle Store</h2>
      <p>Redirecting to store page...</p>
    </div>
  </body>
</html>
